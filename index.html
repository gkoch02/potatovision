<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PotatoVision 🥔</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A5%94%3C/text%3E%3C/svg%3E" />
</head>
<body>
  <div class="crt-overlay" aria-hidden="true"></div>

  <header>
    <h1>PotatoVision <span class="spud">🥔</span></h1>
    <p class="tagline">Filmed on a potato. By choice.</p>
  </header>

  <main>
    <div class="viewport" id="viewport">
      <video id="video" playsinline autoplay muted hidden></video>
      <canvas id="canvas" width="480" height="360" aria-label="PotatoVision live feed"></canvas>
      <canvas id="emojiCanvas" width="480" height="360" hidden aria-hidden="true"></canvas>
      <div id="status" class="status" role="status">Click Start camera to begin.</div>
    </div>

    <div class="controls">
      <button type="button" id="start" class="primary">Start camera</button>

      <label class="slider">
        <span>🥔 Potato Level: <output id="levelOut">0</output></span>
        <input type="range" id="level" min="0" max="100" value="0" />
      </label>

      <div class="row">
        <button type="button" id="snap">📸 Snap</button>
        <label class="toggle">
          <input type="checkbox" id="emojiMode" />
          <span>🥔 Emoji Mode</span>
        </label>
      </div>

      <details class="presets">
        <summary>Presets</summary>
        <div class="preset-row">
          <button type="button" data-preset="0">Pristine</button>
          <button type="button" data-preset="35">Zoom 2020</button>
          <button type="button" data-preset="65">Skype 2008</button>
          <button type="button" data-preset="90">Found Footage</button>
          <button type="button" data-preset="100">Actual Potato</button>
        </div>
      </details>
    </div>
  </main>

  <footer>
    <p>No frames leave your machine. Promise. <a href="https://github.com/gkoch02/potatovision">source</a></p>
  </footer>

  <!-- Loaded as a classic script (with defer) rather than a module so it runs
       even when index.html is opened directly via file:// — Safari refuses to
       load ES modules from file:// origins. -->
  <script defer src="potatovision.js"></script>
</body>
</html>
