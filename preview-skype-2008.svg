<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" role="img" aria-label="Preview: PotatoVision at Skype 2008 (Potato Level 65) — chunky pixels, color banding, chromatic ghost, scanlines, vignette.">
  <defs>
    <radialGradient id="vig" cx="50%" cy="50%" r="62%">
      <stop offset="38%" stop-color="rgba(0,0,0,0)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.78)"/>
    </radialGradient>
    <pattern id="scan" width="8" height="4" patternUnits="userSpaceOnUse">
      <rect width="8" height="2" fill="rgba(0,0,0,0)"/>
      <rect y="2" width="8" height="2" fill="rgba(0,0,0,0.36)"/>
    </pattern>

    <!-- single-color silhouette, used for chromatic ghost layers -->
    <g id="silhouette">
      <!-- hair / head top -->
      <rect x="168" y="80"  width="144" height="32"/>
      <rect x="160" y="96"  width="160" height="16"/>
      <!-- face -->
      <rect x="168" y="112" width="144" height="112"/>
      <rect x="184" y="224" width="112" height="16"/>
      <!-- neck -->
      <rect x="208" y="240" width="64"  height="24"/>
      <!-- shoulders / torso -->
      <rect x="152" y="264" width="176" height="16"/>
      <rect x="120" y="280" width="240" height="16"/>
      <rect x="80"  y="296" width="320" height="64"/>
    </g>
  </defs>

  <!-- background: quantized greenish blocks -->
  <rect width="480" height="360" fill="#283820"/>
  <rect x="0"   y="0"   width="192" height="160" fill="#384c30"/>
  <rect x="288" y="0"   width="192" height="160" fill="#384c30"/>
  <rect x="0"   y="160" width="96"  height="200" fill="#304028"/>
  <rect x="384" y="160" width="96"  height="200" fill="#304028"/>
  <rect x="64"  y="32"  width="64"  height="64"  fill="#405838"/>
  <rect x="352" y="48"  width="64"  height="48"  fill="#405838"/>

  <!-- chromatic ghosts: red shifted left, cyan shifted right, screen-blended -->
  <g style="mix-blend-mode: screen">
    <use href="#silhouette" x="-6" fill="rgba(255,80,80,0.55)"/>
    <use href="#silhouette" x="6"  fill="rgba(80,200,255,0.55)"/>
  </g>

  <!-- shirt / shoulders (blue-gray, quantized) -->
  <g fill="#485e68">
    <rect x="152" y="264" width="176" height="16"/>
    <rect x="120" y="280" width="240" height="16"/>
    <rect x="80"  y="296" width="320" height="64"/>
  </g>
  <!-- shirt highlight band (lighter quantized step) -->
  <rect x="80" y="296" width="320" height="8" fill="#587080"/>

  <!-- skin: head + neck -->
  <g fill="#c89870">
    <rect x="168" y="112" width="144" height="112"/>
    <rect x="184" y="224" width="112" height="16"/>
    <rect x="208" y="240" width="64"  height="24"/>
  </g>
  <!-- skin shading on the right cheek (one quantized step darker) -->
  <rect x="280" y="128" width="32" height="80" fill="#a87858"/>

  <!-- hair -->
  <g fill="#281008">
    <rect x="168" y="80"  width="144" height="32"/>
    <rect x="160" y="96"  width="160" height="16"/>
    <rect x="168" y="112" width="24"  height="32"/>
    <rect x="288" y="112" width="24"  height="32"/>
  </g>

  <!-- eyes -->
  <g fill="#181008">
    <rect x="200" y="152" width="24" height="12"/>
    <rect x="256" y="152" width="24" height="12"/>
  </g>

  <!-- mouth -->
  <rect x="216" y="192" width="48" height="8" fill="#783028"/>

  <!-- scanlines + vignette overlays -->
  <rect width="480" height="360" fill="url(#scan)"/>
  <rect width="480" height="360" fill="url(#vig)"/>
</svg>
