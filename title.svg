<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 180" width="900" height="180" role="img" aria-label="PotatoVision — Filmed on a potato. By choice.">
  <defs>
    <radialGradient id="bg" cx="50%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#14201a"/>
      <stop offset="60%" stop-color="#0a0e0a"/>
      <stop offset="100%" stop-color="#050805"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="scan" width="100%" height="3" patternUnits="userSpaceOnUse">
      <rect width="100%" height="2" fill="rgba(0,0,0,0)"/>
      <rect y="2" width="100%" height="1" fill="rgba(0,0,0,0.18)"/>
    </pattern>
    <style><![CDATA[
      .title { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
               font-size: 84px; font-weight: 700; letter-spacing: 0.04em; }
      .tag   { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
               font-size: 22px; font-style: italic; fill: #6a8c6a; }
    ]]></style>
  </defs>

  <rect width="900" height="180" fill="url(#bg)"/>

  <g text-anchor="middle">
    <text class="title" x="452" y="90" fill="rgba(255,80,80,0.55)">PotatoVision 🥔</text>
    <text class="title" x="448" y="90" fill="rgba(80,200,255,0.55)">PotatoVision 🥔</text>
    <text class="title" x="450" y="90" fill="#9aff66" filter="url(#glow)">PotatoVision 🥔</text>

    <text class="tag" x="450" y="138">Filmed on a potato. By choice.</text>
  </g>

  <rect width="900" height="180" fill="url(#scan)"/>
</svg>
